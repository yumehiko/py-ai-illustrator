[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "py-ai-illustrator"
version = "0.1.0.dev0"
description = "Parse, inspect, safely edit, and verify supported Adobe Illustrator files with a Python core; optionally compile native AI through Illustrator 2026."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "py-ai-illustrator contributors" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
]
dependencies = [
  "zstandard>=0.23,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[project.scripts]
py-ai = "py_ai_illustrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_ai_illustrator"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
